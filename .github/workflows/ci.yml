name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  migrations:
    name: Migrations apply & match the schema
    runs-on: ubuntu-latest

    # A throwaway database. Never point this at a real one: the whole value is
    # that it can be destroyed and rebuilt from the migrations alone.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buttergolf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buttergolf_ci
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/buttergolf_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/buttergolf_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves every migration still applies to an empty database, in order.
      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Proves the migrations produce exactly the schema the code is generated
      # from. Catches the case that broke the preview during #563: a schema
      # change shipping without a migration to create it, so the deployed code
      # queries a column the database doesn't have.
      #
      # Exit code 2 means "there is a difference".
      - name: Check the schema matches the migrations
        working-directory: packages/db
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "Schema matches the applied migrations." \
          || {
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::prisma/schema.prisma does not match the migrations."
              echo "Run 'pnpm db:migrate:dev' to generate the missing migration and commit it."
            fi
            exit "$status"
          }
